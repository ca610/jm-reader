name: Android CI

# Build a debug APK on every push / pull request, and make the APK downloadable
# from the run's "Artifacts" section. Also usable as a manual build check.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The runner image ships an Android SDK whose licenses are already accepted.
      # This step adds compileSdk 36 if the image does not have it yet; when no
      # sdkmanager is found the Android Gradle Plugin downloads it on demand.
      - name: Ensure Android SDK platform 36
        run: |
          # Failures here are not fatal: Gradle downloads missing SDK packages itself.
          SDKMANAGER="$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          else
            echo "sdkmanager not found - letting Gradle resolve the SDK packages"
          fi

      - name: Build debug APK
        run: |
          # The wrapper is committed without the executable bit, so set it here.
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/JMReader-debug-${GITHUB_SHA::7}.apk"
          ls -lh artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jm-reader-debug-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
